version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "8G"
      ONLINE_MODE: "FALSE"
      MODPACK_PLATFORM: AUTO_CURSEFORGE
      CF_MODPACK_MANIFEST: https://random-game-drops.github.io/mc-mod-pack-simple/manifest.json
      CF_SLUG: "custom"
      CF_API_KEY: ${CF_API_KEY}
    volumes:
      - ./data:/data
