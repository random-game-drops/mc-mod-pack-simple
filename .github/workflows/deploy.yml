name: Build Modpack mrpack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mrpack archive
        run: |
          zip -r modpack.mrpack . \
            -x "*.git*" \
               ".github/*" \
               "modpack.mrpack"

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git tag -d latest || true
          git tag latest
          git push origin latest --force

          gh release create latest \
            --title "Latest Modpack Build" \
            --notes "Automated build of the modpack." \
            "modpack.mrpack#application/zip" \
            "modrinth.index.json#application/json"