name: Build Modpack Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip archive
        run: |
          zip -r modpack.zip . \
            -x "*.git*" \
               ".github/*" \
               "modpack.zip"

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it doesn't exist, or just use it if it does
          gh release delete latest --yes || true
          git tag -d latest || true
          git tag latest
          git push origin latest --force

          # Upload modpack.zip (default binary type)
          # Upload manifest.json with EXPLICIT application/json type
          gh release create latest \
            --title "Latest Modpack Build" \
            --notes "Automated build of the modpack." \
            "modpack.zip" \
            "manifest.json#application/json"